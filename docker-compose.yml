services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5673:5672", "15673:15672"]
    volumes:
      - "./docker/rabbitmq/rabbitmq.dev.conf:/etc/rabbitmq/rabbitmq.conf:ro"
      - "./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  erp:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports: ["5435:5432"]
    volumes:
      - "erpdata:/var/lib/postgresql/data"
      - "./docker/erp-seed:/docker-entrypoint-initdb.d:ro"

volumes:
  pgdata:
  erpdata:
